name: 'Data Contract — Delete'
description: >
  Deletes ephemeral data contracts from a CPD/watsonx project.
  Used after PR validation to clean up _PR_<pr_number> contracts.
  Posts a PR comment confirming deletion (or reporting failure).

inputs:
  contract-ids:
    description: 'Space-separated list of project_id:contract_id pairs to delete'
    required: true
  url:
    description: 'CPD / watsonx base URL'
    required: true
  environment:
    description: "Deployment type: 'ibm_cloud' (default), 'aws_cloud', 'gov_cloud' or 'on_prem'"
    required: false
    default: 'ibm_cloud'
  api-key:
    description: 'API key (IBM Cloud IAM API key for cloud environments; optional for on_prem when username/password is used)'
    required: false
    default: ''
  username:
    description: 'Username (on_prem only)'
    required: false
    default: ''
  password:
    description: 'Password (on_prem only, when no api-key is given)'
    required: false
    default: ''
  account-id:
    description: 'Account ID (aws_cloud only)'
    required: false
    default: ''
  iam-url:
    description: 'Token endpoint override for cloud environments (e.g. https://iam.cloud.ibm.com/identity/token). When empty, ibm_cloud uses the IBM Cloud test IAM endpoint and other cloud types use the SDK default. Ignored for on_prem.'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number to comment on'
    required: true
  repository:
    description: 'Repository in owner/repo format'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install data-intelligence-sdk
      shell: bash
      run: |
        pip install "data-intelligence-sdk==2.3.0"

    - name: Delete ephemeral contracts
      id: delete
      shell: bash
      env:
        PLATFORM_URL:        ${{ inputs.url }}
        PLATFORM_ENV:        ${{ inputs.environment }}
        PLATFORM_API_KEY:    ${{ inputs.api-key }}
        PLATFORM_USERNAME:   ${{ inputs.username }}
        PLATFORM_PASSWORD:   ${{ inputs.password }}
        PLATFORM_ACCOUNT_ID: ${{ inputs.account-id }}
        IAM_TOKEN_URL:       ${{ inputs.iam-url }}
      run: |
        python3 ${{ github.action_path }}/../../scripts/delete_contract.py \
          ${{ inputs.contract-ids }}

    - name: Post PR comment (deleted)
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        IDS="${{ inputs.contract-ids }}"
        COUNT=$(echo $IDS | wc -w | tr -d ' ')
        cat > /tmp/pr_body.md <<EOF
        ## 🗑️ Ephemeral Contracts Cleaned Up

        $COUNT ephemeral contract(s) deleted after PR validation.

        \`\`\`
        $IDS
        \`\`\`
        EOF
        gh pr comment "${{ inputs.pr-number }}" \
          --body-file /tmp/pr_body.md \
          --repo "${{ inputs.repository }}"

    - name: Post PR comment (delete failed)
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cat > /tmp/pr_body.md <<'MDEOF'
        ## ⚠️ Ephemeral Contract Cleanup — failed

        One or more ephemeral contracts could not be deleted.
        Please remove them manually from the project.

        ```
        See the workflow logs for the full error output.
        ```
        MDEOF
        gh pr comment "${{ inputs.pr-number }}" \
          --body-file /tmp/pr_body.md \
          --repo "${{ inputs.repository }}"
