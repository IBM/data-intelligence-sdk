name: 'Data Contract — Save Test Results'
description: >
  After a merge, finds the test results saved by the merged PR's test run and
  stores them against the newly created/updated real contracts using
  POST /test_results. Then comments on the merged PR with the created/updated
  contracts, their IDs and the saved test result IDs.

inputs:
  contract-ids:
    description: 'Space-separated list of project_id:contract_id pairs (from the create action in merge mode)'
    required: true
  create-summary:
    description: "Markdown summary of the created/updated contracts (the create action's 'body' output); included in the merged PR comment"
    required: false
    default: ''
  url:
    description: 'CPD / watsonx base URL'
    required: true
  environment:
    description: "Deployment type: 'ibm_cloud' (default), 'aws_cloud', 'gov_cloud' or 'on_prem'"
    required: false
    default: 'ibm_cloud'
  api-key:
    description: 'API key (IBM Cloud IAM API key for cloud environments; optional for on_prem when username/password is used)'
    required: false
    default: ''
  username:
    description: 'Username (on_prem only)'
    required: false
    default: ''
  password:
    description: 'Password (on_prem only, when no api-key is given)'
    required: false
    default: ''
  account-id:
    description: 'Account ID (aws_cloud only)'
    required: false
    default: ''
  iam-url:
    description: 'Token endpoint override for cloud environments (e.g. https://iam.cloud.ibm.com/identity/token). When empty, ibm_cloud uses the IBM Cloud test IAM endpoint and other cloud types use the SDK default. Ignored for on_prem.'
    required: false
    default: ''
  repository:
    description: 'Repository in owner/repo format'
    required: true
  github-token:
    description: 'GitHub token used to look up the merged PR, download its artifact and post the PR comment (needs actions: read and pull-requests: write)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download test results from the merged PR
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO:     ${{ inputs.repository }}
        SHA:      ${{ github.sha }}
      run: |
        PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
        if [ -z "$PR" ]; then
          echo "No pull request is associated with $SHA — nothing to save."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "pr=$PR" >> "$GITHUB_OUTPUT"

        ARTIFACT_ID=$(gh api "repos/$REPO/actions/artifacts?name=data-contract-test-results-pr-$PR" \
          --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
        if [ -z "$ARTIFACT_ID" ]; then
          echo "No unexpired test-result artifact found for PR #$PR — nothing to save."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Using artifact $ARTIFACT_ID from PR #$PR"
        gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/test-results.zip"
        mkdir -p "$RUNNER_TEMP/test-results"
        unzip -o -q "$RUNNER_TEMP/test-results.zip" -d "$RUNNER_TEMP/test-results"
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Install data-intelligence-sdk
      if: steps.download.outputs.found == 'true'
      shell: bash
      run: |
        pip install "data-intelligence-sdk==2.3.0"

    - name: Save test results to the contracts
      id: save
      if: steps.download.outputs.found == 'true'
      shell: bash
      env:
        PLATFORM_URL:        ${{ inputs.url }}
        PLATFORM_ENV:        ${{ inputs.environment }}
        PLATFORM_API_KEY:    ${{ inputs.api-key }}
        PLATFORM_USERNAME:   ${{ inputs.username }}
        PLATFORM_PASSWORD:   ${{ inputs.password }}
        PLATFORM_ACCOUNT_ID: ${{ inputs.account-id }}
        IAM_TOKEN_URL:       ${{ inputs.iam-url }}
      run: |
        python3 ${{ github.action_path }}/../../scripts/save_test_results.py \
          --results-dir "$RUNNER_TEMP/test-results" \
          ${{ inputs.contract-ids }}

    - name: Comment on the merged PR
      if: always() && steps.download.outputs.pr != ''
      shell: bash
      env:
        GH_TOKEN:       ${{ inputs.github-token }}
        PR:             ${{ steps.download.outputs.pr }}
        REPO:           ${{ inputs.repository }}
        CREATE_SUMMARY: ${{ inputs.create-summary }}
        SAVE_SUMMARY:   ${{ steps.save.outputs.body }}
        SAVE_OUTCOME:   ${{ steps.save.outcome }}
        RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "## 🚀 Data contracts deployed after merge"
          echo
          if [ -n "$CREATE_SUMMARY" ]; then
            # Drop the create summary's own title; keep the per-contract lines.
            printf '%s\n' "$CREATE_SUMMARY" | sed '1{/^## /d}'
            echo
          fi
          if [ -n "$SAVE_SUMMARY" ]; then
            printf '%s\n' "$SAVE_SUMMARY"
          elif [ "$SAVE_OUTCOME" = "skipped" ]; then
            echo "_No PR test results were found to save._"
          else
            echo "_Saving test results failed — see the [workflow run]($RUN_URL)._"
          fi
        } > /tmp/pr_body.md
        gh pr comment "$PR" --body-file /tmp/pr_body.md --repo "$REPO"
