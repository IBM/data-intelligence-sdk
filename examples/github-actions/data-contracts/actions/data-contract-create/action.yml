name: 'Data Contract — Create'
description: >
  Creates data contracts in a CPD/watsonx project. In PR mode, creates an
  ephemeral contract named <name>_PR_<pr_number> for CI validation only.
  In merge mode, upserts the real contract with the canonical name.

inputs:
  mode:
    description: "'pr' (ephemeral, for CI) or 'merge' (upsert real contract)"
    required: true
  changed-files:
    description: 'Space-separated list of changed contract file paths'
    required: true
  url:
    description: 'CPD / watsonx base URL'
    required: true
  environment:
    description: "Deployment type: 'ibm_cloud' (default), 'aws_cloud', 'gov_cloud' or 'on_prem'"
    required: false
    default: 'ibm_cloud'
  api-key:
    description: 'API key (IBM Cloud IAM API key for cloud environments; optional for on_prem when username/password is used)'
    required: false
    default: ''
  username:
    description: 'Username (on_prem only)'
    required: false
    default: ''
  password:
    description: 'Password (on_prem only, when no api-key is given)'
    required: false
    default: ''
  account-id:
    description: 'Account ID (aws_cloud only)'
    required: false
    default: ''
  iam-url:
    description: 'Token endpoint override for cloud environments (e.g. https://iam.cloud.ibm.com/identity/token). When empty, ibm_cloud uses the IBM Cloud test IAM endpoint and other cloud types use the SDK default. Ignored for on_prem.'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number — required when mode is pr'
    required: false
    default: ''
  repository:
    description: 'Repository in owner/repo format'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true

outputs:
  contract-ids:
    description: 'Space-separated list of project_id:contract_id pairs'
    value: ${{ steps.create.outputs.contract_ids }}
  body:
    description: 'Markdown summary of create results'
    value: ${{ steps.create.outputs.body }}

runs:
  using: 'composite'
  steps:
    - name: Install data-intelligence-sdk
      shell: bash
      run: |
        pip install "data-intelligence-sdk==2.3.0"

    - name: Create contracts
      id: create
      shell: bash
      env:
        PLATFORM_URL:        ${{ inputs.url }}
        PLATFORM_ENV:        ${{ inputs.environment }}
        PLATFORM_API_KEY:    ${{ inputs.api-key }}
        PLATFORM_USERNAME:   ${{ inputs.username }}
        PLATFORM_PASSWORD:   ${{ inputs.password }}
        PLATFORM_ACCOUNT_ID: ${{ inputs.account-id }}
        IAM_TOKEN_URL:       ${{ inputs.iam-url }}
      run: |
        python3 ${{ github.action_path }}/../../scripts/create_contract.py \
          --mode "${{ inputs.mode }}" \
          --pr-number "${{ inputs.pr-number }}" \
          ${{ inputs.changed-files }}

    - name: Post PR comment (success)
      if: success() && inputs.pr-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BODY:     ${{ steps.create.outputs.body }}
      run: |
        printf "%b" "$BODY" > /tmp/pr_body.md
        gh pr comment "${{ inputs.pr-number }}" \
          --body-file /tmp/pr_body.md \
          --repo "${{ inputs.repository }}"

    - name: Post PR comment (failure)
      if: failure() && inputs.pr-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cat > /tmp/pr_body.md <<'MDEOF'
        ## ❌ Data Contract Create — failed

        ```
        See the workflow logs for the full error output.
        ```
        MDEOF
        gh pr comment "${{ inputs.pr-number }}" \
          --body-file /tmp/pr_body.md \
          --repo "${{ inputs.repository }}"
